<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo | RDM Gráfica</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../css/dashboard (1).css" rel="stylesheet">
</head>
<body>

<nav class="navbar-admin">
<svg class="navbar-wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 150" preserveAspectRatio="none">
<path d="M0,0 L1440,0 L1440,100 C1260,140 1080,80 900,115 C720,150 540,85 360,118 C240,140 120,100 0,120 Z" fill="#d91c23"/>
<path d="M0,0 L1440,0 L1440,88 C1260,128 1080,68 900,103 C720,138 540,73 360,106 C240,128 120,88 0,108 Z" fill="#111"/>
</svg>
<div class="navbar-admin-inner">
<span class="navbar-admin-brand">RDM Admin</span>
<a href="feedback.html" class="navbar-admin-link">Feedback</a>
</div>
</nav>

<main class="admin-bg">
<div class="admin-container">

<section class="reveal">
<h2 class="admin-title">Estampas</h2>
<div class="admin-card">
<div class="row g-4">

<div class="col-md-6 admin-col-upload">
<label class="upload-box upload-box-solo">
<input type="file" name="estampa" accept="image/*" hidden>
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</label>
</div>

<div class="col-md-6 admin-col-form">
<div class="admin-field-group">
<label for="dataUploadEstampa" class="admin-label">Data do upload</label>
<input type="date" id="dataUploadEstampa" name="dataUploadEstampa" class="admin-input">
</div>
<button type="button" class="btn-admin">enviar</button>
</div>

</div>
</div>
</section>

<section class="reveal">
<h2 class="admin-title">Encomendas finalizadas:</h2>
<div class="admin-card">
<div class="row g-4">

<div class="col-md-5 admin-col-upload">
<label class="upload-box upload-box-solo">
<input type="file" name="encomendaFinalizada" accept="image/*" hidden>
<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</label>
</div>

<div class="col-md-7 admin-col-form">
<div class="admin-field-group">
<label for="descricaoEncomenda" class="admin-label">Descrição:</label>
<input type="text" id="descricaoEncomenda" name="descricaoEncomenda" class="admin-input">
</div>
<div class="admin-field-group admin-field-inline">
<label for="dataUploadEncomenda" class="admin-label mb-0">Data Do Upload:</label>
<input type="date" id="dataUploadEncomenda" name="dataUploadEncomenda" class="admin-input admin-input-inline">
</div>
<button type="button" class="btn-admin">enviar</button>
</div>

</div>
</div>
</section>

<section class="reveal">
<h2 class="admin-title">Listagem de Uploads:</h2>
<div class="admin-card admin-card-list">
<div class="upload-list-wrap">
<ul id="listaUploads" class="upload-list">
<!-- Preenchido via JavaScript -->
</ul>
<div class="upload-preview"></div>
</div>
</div>
</section>

</div>
</main>

<script>
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting) entry.target.classList.add('active');
});
});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
</script>
<script>
// A listagem de uploads é montada dinamicamente aqui.
// Cada item deve ser adicionado em #listaUploads, por exemplo:
//
// const li = document.createElement('li');
// li.innerHTML = `<span>${nomeDoArquivo}</span><button class="btn-admin btn-admin-sm">excluir</button>`;
// document.getElementById('listaUploads').appendChild(li);
</script>
</body>
</html>
