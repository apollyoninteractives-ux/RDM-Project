<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo | RDM Gráfica</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
<link href="../../css/global.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
<link href="../css/auth-guard.css" rel="stylesheet">
<!--
    Proteção real desta página: enquanto o auth-guard.js não confirmar
    que existe um admin logado no Firebase, o CSS acima mantém a página
    inteira invisível (evita "piscar" conteúdo admin antes do redirect).
-->
<script type="module" src="../js/auth-guard.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-rdm fixed-top">
    <svg class="navbar-wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 150" preserveAspectRatio="none"
        aria-hidden="true">
        <path d="M0,0 L1440,0 L1440,100 C1260,122 1080,89 900,109 C720,127 540,93 360,110 C240,121 120,101 0,111 Z"
            fill="#d91c23" />
        <path d="M0,0 L1440,0 L1440,88 C1260,110 1080,77 900,97 C720,115 540,81 360,98 C240,109 120,89 0,99 Z"
            fill="#ffffff" />
        <path d="M0,0 L1440,0 L1440,81 C1260,103 1080,70 900,90 C720,108 540,74 360,91 C240,102 120,82 0,92 Z"
            fill="#111" />
    </svg>
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">RDM Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdmin"
            aria-controls="menuAdmin" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <ul class="navbar-nav collapse navbar-collapse" id="menuAdmin">
            <li class="nav-item"><a class="nav-link" href="../../html/home.html">Início</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="dashboard.html">Uploads</a></li>
            <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
            <li class="nav-item"><a class="nav-link" href="#" id="btnLogout">Sair</a></li>
        </ul>
    </div>
</nav>

<main class="admin-bg">
    <div class="admin-container">

        <section class="reveal">
            <h2 class="admin-title">Estampas</h2>
            <div class="admin-card">
                <div class="row g-4">
                    <div class="d-flex flex-row">
                        <div class="col-md-6 admin-col-upload">
                            <label class="upload-box upload-box-solo">
                                <input type="file" name="estampa" accept="image/*" hidden class="upload-input">
                                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff"
                                    stroke-width="2">
                                    <path d="M12 19V5M5 12l7-7 7 7" />
                                </svg>
                            </label>
                            <span class="upload-status">Nenhum arquivo selecionado</span>
                        </div>
                        <div class="col-md-6 admin-col-form">
                            <div class="admin-field-group">
                                <label for="dataUploadEstampa" class="admin-label">Data do upload</label>
                                <input type="date" id="dataUploadEstampa" name="dataUploadEstampa"
                                    class="admin-input">
                            </div>
                            <button type="button" class="btn-admin">enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="reveal">
            <h2 class="admin-title">Encomendas finalizadas:</h2>
            <div class="admin-card">
                <div class="row g-4">
                    <div class="d-flex flex-row">
                        <div class="col-md-5 admin-col-upload">
                            <label class="upload-box upload-box-solo">
                                <input type="file" name="encomendaFinalizada" accept="image/*" hidden
                                    class="upload-input">
                                <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff"
                                    stroke-width="2">
                                    <path d="M12 19V5M5 12l7-7 7 7" />
                                </svg>
                            </label>
                            <span class="upload-status">Nenhum arquivo selecionado</span>
                        </div>

                        <div class="col-md-7 admin-col-form">
                            <div class="admin-field-group">
                                <label for="descricaoEncomenda" class="admin-label">Descrição:</label>
                                <input type="text" id="descricaoEncomenda" name="descricaoEncomenda"
                                    class="admin-input">
                            </div>
                            <div class="admin-field-group admin-field-inline admin-field-inline--stacked">
                                <label for="dataUploadEncomenda" class="admin-label mb-0">Data Do Upload:</label>
                                <input type="date" id="dataUploadEncomenda" name="dataUploadEncomenda"
                                    class="admin-input">
                            </div>
                            <button type="button" class="btn-admin">enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="reveal">
            <h2 class="admin-title">Listagem de Uploads:</h2>
            <div class="admin-card admin-card-list">
                <div class="upload-list-wrap">
                    <ul id="listaUploads" class="upload-list">
                        <!-- Preenchido via JavaScript -->
                    </ul>
                    <div class="upload-preview"></div>
                </div>
            </div>
        </section>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/reveal.js"></script>
<script src="../js/dashboard.js"></script>
<script type="module" src="../js/logout.js"></script>
</body>

</html>
