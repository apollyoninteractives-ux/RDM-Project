<head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-rdm fixed-top">

    <svg class="navbar-wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 150" preserveAspectRatio="none">
        <path d="M0,0 L1440,0 L1440,100 C1260,140 1080,80 900,115 C720,150 540,85 360,118 C240,140 120,100 0,120 Z"
            fill="#d91c23" />
        <path d="M0,0 L1440,0 L1440,88 C1260,128 1080,68 900,103 C720,138 540,73 360,106 C240,128 120,88 0,108 Z"
            fill="#111" />
    </svg>
    <div class="container d-flex align-items-center">
        <a class="navbar-brand fw-bold fs-3" href="#">RDM Admin</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAdmin">

<main class="admin-bg">
    <div class="admin-container">

        <section class="reveal">
            <h2 class="admin-title">Estampas</h2>
            <div class="admin-card">
                <div class="row g-4">


                    <div style="display: flex; flex-direction: row;">
                        <div class="col-md-6 admin-col-upload" style="width: 30%; margin-top: 16px;">
                            <label class="upload-box upload-box-solo">
                                <input type="file" name="estampa" accept="image/*" hidden class="upload-input">
                                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff"
                                    stroke-width="2">
                                    <path d="M12 19V5M5 12l7-7 7 7" />
                                </svg>
                            </label>
                            <span class="upload-status">Nenhum arquivo selecionado</span>
                        </div>
                        <div class="col-md-6 admin-col-form" style=" margin-top: 32px;">
                            <div class="admin-field-group">
                                <label for="dataUploadEstampa" class="admin-label">Data do upload</label>
                                <input type="date" id="dataUploadEstampa" name="dataUploadEstampa"
                                    class="admin-input" style="width: 130%;">
                            </div>
                        </div>
                    </div>


                    <button type="button" class="btn-admin" style="margin-left: 5%; width: 90%; margin-top: 20px;">enviar</button>

                </div>
            </div>
        </section>

        <section class="reveal">
            <h2 class="admin-title">Encomendas finalizadas:</h2>
            <div class="admin-card">
                <div class="row g-4">

                    <div style="display: flex; flex-direction: row;">
                    <div class="col-md-5 admin-col-upload"  style="width: 30%; margin-top: 32px;">
                        <label class="upload-box upload-box-solo">
                            <input type="file" name="encomendaFinalizada" accept="image/*" hidden class="upload-input">
                            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff"
                                stroke-width="2">
                                <path d="M12 19V5M5 12l7-7 7 7" />
                            </svg>
                        </label>
                        <span class="upload-status">Nenhum arquivo selecionado</span>
                    </div>

                    <div class="col-md-7 admin-col-form">
                        <div class="admin-field-group" style="margin-left: 32px; margin-top: 16px;">
                            <label for="descricaoEncomenda" class="admin-label">Descrição:</label>
                            <input type="text" id="descricaoEncomenda" name="descricaoEncomenda"
                                class="admin-input">
                        </div>
                        <div class="admin-field-group admin-field-inline" style="display: flex; flex-direction: column; align-items: flex-start; margin-left: 32px;">
                            <label for="dataUploadEncomenda" class="admin-label mb-0" >Data Do Upload:</label>
                            <input type="date" id="dataUploadEncomenda" name="dataUploadEncomenda"
                                class="admin-input ">
                        </div>
                    </div>
                    </div>
                    <button type="button" class="btn-admin"style="margin-left: 5%; width: 90%; margin-top: 20px;">enviar</button>

                </div>
            </div>
        </section>

        <section class="reveal">
            <h2 class="admin-title">Listagem de Uploads:</h2>
            <div class="admin-card admin-card-list">
                <div class="upload-list-wrap">
                    <ul id="listaUploads" class="upload-list">
                        <!-- Preenchido via JavaScript -->
                    </ul>
                    <div class="upload-preview"></div>
                </div>
            </div>
        </section>

    </div>
</main>

<script>
    // Atualiza o textinho de confirmação abaixo de cada quadradinho de upload.
    document.querySelectorAll('.upload-input').forEach(input => {
        const status = input.closest('.admin-col-upload').querySelector('.upload-status');
        input.addEventListener('change', () => {
            const qtd = input.files.length;
            if (qtd === 0) {
                status.textContent = 'Nenhum arquivo selecionado';
                status.classList.remove('upload-status-ok');
            } else if (qtd === 1) {
                status.textContent = '1 arquivo selecionado';
                status.classList.add('upload-status-ok');
            } else {
                status.textContent = `${qtd} arquivos selecionados`;
                status.classList.add('upload-status-ok');
            }
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('active');
        });
    });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
<script>
    // A listagem de uploads é montada dinamicamente aqui.

    // document.getElementById('listaUploads').appendChild(li);
</script>
<script type="module">
    import { logoutAdmin } from "../js/auth-guard.js";
    document.getElementById("btnLogout").addEventListener("click", (e) => {
        e.preventDefault();
        logoutAdmin();
    });
</script>
</body>

</html>
